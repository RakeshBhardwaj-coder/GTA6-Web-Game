    <!-- Force local SDK mode for development / preview environments outside crazygames.com -->
    <script>
      function isCrazyGames() {
        const hostname = window.location.hostname;
        return hostname === 'crazygames.com' || hostname.endsWith('.crazygames.com');
      }
      try {
        if (
          typeof window !== 'undefined' &&
          !isCrazyGames() &&
          !window.location.search.includes('useLocalSdk=true')
        ) {
          var u = new URL(window.location.href);
          u.searchParams.set('useLocalSdk', 'true');
          window.history.replaceState(null, '', u.toString());
        }
      } catch (e) {
        // ignore
      }
    </script>
    <!-- Load the SDK before your game code -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onerror="this.onerror=null;console.warn('CrazyGames SDK offline or blocked');"></script>
